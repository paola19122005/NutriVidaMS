spring.application.name=catalogo-servicios
server.port=8092

spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida_catalogo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS handled in config
spring.jpa.open-in-view=false

usuarios.base-url=http://localhost:8081